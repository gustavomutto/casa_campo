<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Acceso propietario · Casas Campestres</title>
  <link rel="stylesheet" href="/vendor/font/400.css"><link rel="stylesheet" href="/vendor/font/600.css"><link rel="stylesheet" href="/vendor/font/700.css"><link rel="stylesheet" href="/vendor/font/800.css">
  <link rel="stylesheet" href="/vendor/fa/css/all.min.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0f2e12,#2e7d32);padding:20px">
  <form class="card card-pad" id="loginForm" style="width:min(400px,100%)">
    <div class="center" style="margin-bottom:20px">
      <div class="brand-mark" style="margin:0 auto 12px;width:52px;height:52px;font-size:1.4rem"><i class="fa-solid fa-leaf"></i></div>
      <h1 style="font-size:1.35rem">Panel del propietario</h1>
      <p class="muted small">Casas Campestres</p>
    </div>
    <div class="field"><label for="u">Usuario</label><input id="u" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required></div>
    <div class="alert alert-danger hidden" id="err"></div>
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:8px"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    <p class="center small" style="margin-top:16px"><a href="/">← Volver al sitio</a></p>
  </form>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
